<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiteria Octave - Track Showcase</title>
    <link rel="stylesheet" href="assets/css/weekimage.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <!-- Background Container -->
    <div id="background-container">
        <div id="animated-background"></div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-header">
            <h2>Octave Settings</h2>
            <button id="close-settings" class="close-btn">&times;</button>
        </div>
        
        <div class="settings-content">
            <div class="setting-group">
                <h3>Select Tracks</h3>
                <div class="track-selection-controls">
                    <button id="select-all-tracks" class="track-control-btn">Select All</button>
                    <button id="unselect-all-tracks" class="track-control-btn">Unselect All</button>
                </div>
                <div id="track-selector" class="track-selector">
                    <!-- Track checkboxes will be populated here -->
                </div>
            </div>
            
            <div class="setting-group">
                <h3>Background Style</h3>
                <div class="background-options">
                    <button class="bg-option active" data-bg="gradient">Gradient</button>
                    <button class="bg-option" data-bg="neon">Neon</button>
                    <button class="bg-option" data-bg="space">Space</button>
                    <button class="bg-option" data-bg="custom">Custom</button>
                </div>
                
                <div id="custom-bg-controls" class="custom-controls hidden">
                    <label>Background Color 1:</label>
                    <input type="color" id="bg-color1" value="#667eea">
                    <label>Background Color 2:</label>
                    <input type="color" id="bg-color2" value="#764ba2">
                </div>
            </div>
            
            <div class="setting-group">
                <h3>Grid Size</h3>
                <div class="grid-size-controls">
                    <label>Columns: <span id="columns-value">2</span></label>
                    <input type="range" id="columns-slider" min="1" max="4" value="2">
                    <label>Card Size: <span id="card-size-value">400px</span></label>
                    <input type="range" id="card-size-slider" min="300" max="600" value="400">
                    <label>Content Scale: <span id="content-scale-value">100%</span></label>
                    <input type="range" id="content-scale-slider" min="50" max="200" value="100">
                    <label>Text Size: <span id="text-size-value">100%</span></label>
                    <input type="range" id="text-size-slider" min="50" max="200" value="100">
                    <label>Horizontal Spacing: <span id="grid-gap-horizontal-value">30px</span></label>
                    <input type="range" id="grid-gap-horizontal-slider" min="-100" max="200" value="30">
                    <label>Vertical Spacing: <span id="grid-gap-vertical-value">30px</span></label>
                    <input type="range" id="grid-gap-vertical-slider" min="-100" max="200" value="30">
                    <label>Vertical Position: <span id="vertical-position-value">50%</span></label>
                    <input type="range" id="vertical-position-slider" min="-100" max="100" value="50">
                    <label>Horizontal Scroll: <span id="horizontal-scroll-value">0px</span></label>
                    <input type="range" id="horizontal-scroll-slider" min="-500" max="500" value="0">
                </div>
            </div>
            
            <div class="setting-group">
                <h3>Display Options</h3>
                <div class="display-options">
                    <label>
                        <input type="checkbox" id="show-track-meta" checked>
                        Show duration and year
                    </label>
                </div>
            </div>
            
            <div class="setting-group">
                <h3>Custom Text</h3>
                <div class="custom-text-controls">
                    <label>Bottom Right Text:</label>
                    <input type="text" id="custom-text-input" placeholder="Enter custom text..." maxlength="50">
                    <label>
                        <input type="checkbox" id="show-custom-text" checked>
                        Show custom text
                    </label>
                </div>
            </div>
            
            <div class="setting-group">
                <h3>Export Resolution</h3>
                <div class="resolution-controls">
                    <label>Width: <span id="export-width-value">1280px</span></label>
                    <input type="range" id="export-width-slider" min="800" max="2000" value="1280" step="40">
                    <label>Height: <span id="export-height-value">1280px</span></label>
                    <input type="range" id="export-height-slider" min="800" max="2000" value="1280" step="40">
                    <div class="preset-buttons">
                        <button class="preset-btn" data-width="1560" data-height="960" data-hscroll="201" data-vpos="43" data-hspacing="145" data-vspacing="150" data-scale="173" data-textsize="186" data-cardsize="447" data-columns="2">4 Tracks | Text Big</button>
                        <button class="preset-btn" data-width="1560" data-height="960" data-hscroll="79" data-vpos="29" data-hspacing="164" data-vspacing="90" data-scale="127" data-textsize="158" data-cardsize="494" data-columns="2">6 Tracks | Text idfk</button>
                    </div>
                </div>
            </div>
            
            <div class="setting-group">
                <h3>Export</h3>
                <div class="export-controls">
                    <button id="generate-gif" class="export-btn">Generate GIF</button>
                    <button id="download-image" class="export-btn">Download Image</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Header -->
        <header class="weekimage-header">
            <div class="logo-section">
                <img src="assets/images/logo.png" alt="Hiteria Logo" class="header-logo">
                <h1 class="weekimage-title">HITERIA OCTAVE</h1>
            </div>
            <button id="settings-btn" class="settings-btn">⚙️</button>
        </header>

        <!-- Track Grid -->
        <div id="track-grid" class="track-grid">
            <!-- Tracks will be populated here -->
        </div>

        <!-- Custom Text Display -->
        <div id="custom-text-display" class="custom-text-display">
            <!-- Custom text will be displayed here -->
        </div>
    </div>

    <!-- Track Modal -->
    <div id="track-modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="modal-body">
                <!-- Modal content will be populated here -->
            </div>
        </div>
    </div>

    <script src="assets/js/weekimage.js"></script>
</body>
</html>
